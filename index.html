<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cu Bo Gửi Đến lâm Thảo Nguyên ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff758c, #ff7eb3);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            text-align: center;
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.15);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h1 {
            font-size: 28px;
            margin-bottom: 20px;
        }
        .buttons {
            margin-top: 20px;
            position: relative;
        }
        button {
            padding: 10px 25px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        #yesBtn {
            background-color: #ff3366;
            color: white;
            margin-right: 15px;
        }
        #noBtn {
            background-color: #ffffff;
            color: #333;
            position: absolute;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Làm người yêu anh nhé LÂM THẢO NGUYÊN ❤️</h1>
        <div class="buttons">
            <button id="yesBtn" onclick="sayYes()">Đồng ý luôn 🥰</button>
            <button id="noBtn" onmouseover="moveNo()">Không mơ à 😛</button>
        </div>
    </div>

    <script>
        function sayYes() {
            alert('Yay! Anh biết là em sẽ đồng ý mà! Love you so much ❤️');
        }

        function moveNo() {
            const noBtn = document.getElementById('noBtn');
            const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
            const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
            noBtn.style.left = `${x}px`;
            noBtn.style.top = `${y}px`;
        }
    </script>

</body>
</html>
